name: Build Inkora Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Fix Source Layout & Generate Missing Launcher Icons
        run: |
          if [ -d "android/app" ]; then
            echo "WORK_DIR=android" >> $GITHUB_ENV
            WORK_DIR="android"
          else
            echo "WORK_DIR=." >> $GITHUB_ENV
            WORK_DIR="."
          fi

          # 1. Ensure MainActivity.kt is in standard src/main/kotlin
          if [ -d "$WORK_DIR/app/src/kotlin" ] && [ ! -d "$WORK_DIR/app/src/main/kotlin" ]; then
            if ! grep -q "src/kotlin" "$WORK_DIR/app/build.gradle"; then
              echo "Copying src/kotlin to standard src/main/kotlin..."
              mkdir -p "$WORK_DIR/app/src/main/kotlin"
              cp -r "$WORK_DIR/app/src/kotlin/"* "$WORK_DIR/app/src/main/kotlin/"
            fi
          fi

          # 2. Generate missing @mipmap/ic_launcher and @mipmap/ic_launcher_round vector icons
          RES_DIR="$WORK_DIR/app/src/main/res"
          if [ ! -d "$RES_DIR/mipmap-anydpi-v26" ] && [ ! -d "$RES_DIR/mipmap-mdpi" ] && [ ! -d "$RES_DIR/mipmap" ]; then
            echo "Generating missing mipmap/ic_launcher and mipmap/ic_launcher_round resources..."
            mkdir -p "$RES_DIR/mipmap"

            cat << 'EOF' > "$RES_DIR/mipmap/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1E1E2E"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#89B4FA"
                  android:pathData="M34,74 L74,34 L68,28 L28,68 L28,74 Z"/>
          </vector>
          EOF

            cp "$RES_DIR/mipmap/ic_launcher.xml" "$RES_DIR/mipmap/ic_launcher_round.xml"
          fi

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Build Debug APK
        working-directory: ${{ env.WORK_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: 6. Verify APK Binary & Inspect Metadata
        working-directory: ${{ env.WORK_DIR }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK was not generated!"
            exit 1
          fi
          echo "✅ APK successfully built at: $APK_PATH"
          ls -lh "$APK_PATH"

          AAPT2=$(find $ANDROID_HOME/build-tools -name "aapt2" | sort -V | tail -n 1)
          if [ -n "$AAPT2" ]; then
            echo "--- APK BADGING & COMPATIBILITY INFO ---"
            $AAPT2 dump badging "$APK_PATH" | grep -E "package:|sdkVersion:|targetSdkVersion:|launchable-activity:"
          fi

      - name: 7. Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inkora-Debug-APK
          path: ${{ env.WORK_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
